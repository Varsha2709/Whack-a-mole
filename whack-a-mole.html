<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Whack-a-Mole — Mini Game</title>
<style>
  :root{
    --bg:#0f1724; --card:#0b1220; --accent:#ff7a59; --muted:#9aa6b2;
    --tile:#102230; --tile-border:#143044;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:linear-gradient(180deg,#071029 0%, #0f1724 100%); color:#e6eef6;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }

  .container{
    width:100%; max-width:920px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:16px; box-shadow:0 10px 30px rgba(2,6,23,0.6); overflow:hidden;
    display:grid; grid-template-columns: 320px 1fr; gap:20px; padding:20px;
  }

  header{
    grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
  }
  h1{margin:0; font-size:20px; letter-spacing:0.4px}
  .controls{display:flex; gap:10px; align-items:center}
  button, .btn{
    background:var(--accent); color:#071029; border:none; padding:8px 12px; border-radius:10px; cursor:pointer;
    font-weight:600; box-shadow:0 6px 18px rgba(255,122,89,0.12);
  }
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,0.03); box-shadow:none}

  /* left panel */
  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
    padding:16px; border-radius:12px; display:flex; flex-direction:column; gap:12px;
  }
  .stat{
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
    padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.02);
  }
  .big{
    font-size:28px; font-weight:700; color:var(--accent);
  }
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
  select, input[type=range]{width:100%}

  /* board */
  .board-wrap{display:flex; flex-direction:column; gap:12px}
  .board{
    background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
    padding:16px; border-radius:12px; border:1px solid rgba(255,255,255,0.02);
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
  }
  .hole{
    background:var(--tile); height:110px; border-radius:12px; position:relative; overflow:hidden;
    border:1px solid var(--tile-border); display:flex; align-items:flex-end; justify-content:center;
    touch-action:manipulation;
  }
  .mole{
    width:76px; height:76px; background:radial-gradient(circle at 30% 30%, #ffd9c8 0%, #ffb599 40%, #ff7a59 100%);
    border-radius:50%; transform:translateY(120%); transition:transform 180ms cubic-bezier(.22,1,.36,1);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:#3b1a0e; box-shadow:0 8px 18px rgba(10,10,10,0.45);
  }
  .mole.up{ transform:translateY(0%); }

  .footer{display:flex; gap:12px; align-items:center; justify-content:space-between}

  .small{font-size:12px; color:var(--muted)}
  .center{display:flex; align-items:center; gap:8px}

  @media (max-width:880px){
    .container{grid-template-columns: 1fr; padding:14px}
    .hole{height:90px}
    .mole{width:60px;height:60px}
  }

</style>
</head>
<body>
<div class="container" role="application" aria-label="Whack a Mole Game">
  <header>
    <h1>Whack-a-Mole</h1>
    <div class="controls">
      <div class="small">High score: <span id="highScore">0</span></div>
      <button id="startBtn">Start</button>
      <button class="btn ghost" id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="panel" aria-hidden="false">
    <div class="stat">
      <label>Score</label>
      <div class="big" id="score">0</div>
    </div>

    <div class="stat">
      <label>Time left</label>
      <div class="big" id="time">30s</div>
    </div>

    <div class="stat">
      <label>Difficulty</label>
      <select id="difficulty" aria-label="Choose difficulty">
        <option value="easy">Easy (slower)</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard (faster)</option>
      </select>
    </div>

    <div class="stat">
      <label>Sound</label>
      <div class="center"><input type="checkbox" id="soundToggle" checked/> <span class="small">Enable</span></div>
    </div>

    <div style="flex:1"></div>

    <div class="small" style="text-align:center">Tip: Tap or click the mole when it pops up. Mobile-friendly!</div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="game board">
      <!-- 9 holes -->
      <div class="hole" data-index="0"><div class="mole" data-index="0">🐹</div></div>
      <div class="hole" data-index="1"><div class="mole" data-index="1">🐹</div></div>
      <div class="hole" data-index="2"><div class="mole" data-index="2">🐹</div></div>
      <div class="hole" data-index="3"><div class="mole" data-index="3">🐹</div></div>
      <div class="hole" data-index="4"><div class="mole" data-index="4">🐹</div></div>
      <div class="hole" data-index="5"><div class="mole" data-index="5">🐹</div></div>
      <div class="hole" data-index="6"><div class="mole" data-index="6">🐹</div></div>
      <div class="hole" data-index="7"><div class="mole" data-index="7">🐹</div></div>
      <div class="hole" data-index="8"><div class="mole" data-index="8">🐹</div></div>
    </div>

    <div class="footer">
      <div class="small">Level: <strong id="level">1</strong></div>
      <div class="small">Hits: <span id="hits">0</span></div>
      <div class="small">Misses: <span id="misses">0</span></div>
    </div>
  </div>
</div>

<script>
  // Game variables
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const board = document.getElementById('board');
  const moles = Array.from(document.querySelectorAll('.mole'));
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const levelEl = document.getElementById('level');
  const hitsEl = document.getElementById('hits');
  const missesEl = document.getElementById('misses');
  const difficultyEl = document.getElementById('difficulty');
  const highScoreEl = document.getElementById('highScore');
  const soundToggle = document.getElementById('soundToggle');

  let score = 0;
  let timeLeft = 30;
  let timerInterval = null;
  let moleInterval = null;
  let lastIndex = null;
  let isRunning = false;
  let hits = 0, misses = 0;
  let level = 1;

  const highScoreKey = 'whack_highscore_v1';
  const savedHigh = parseInt(localStorage.getItem(highScoreKey) || '0', 10);
  highScoreEl.textContent = savedHigh;

  // Sounds (tiny beep using Web Audio)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq=440, duration=0.06, vol=0.08){
    if(!soundToggle.checked) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    setTimeout(()=>o.stop(), duration*1000 + 20);
  }

  function pickRandomIndex(){
    let idx;
    do { idx = Math.floor(Math.random() * moles.length); } while (idx === lastIndex);
    lastIndex = idx;
    return idx;
  }

  function popMole(){
    const idx = pickRandomIndex();
    const mole = moles[idx];
    mole.classList.add('up');
    // Pop down after some time
    const visibleTime = getVisibleTime();
    setTimeout(()=> {
      if(mole.classList.contains('up')) {
        mole.classList.remove('up');
        misses++;
        missesEl.textContent = misses;
        beep(220, 0.04, 0.04);
      }
    }, visibleTime);
  }

  function getVisibleTime(){
    const diff = difficultyEl.value;
    let base;
    if(diff === 'easy') base = 900 - (level-1)*60;
    else if(diff === 'normal') base = 650 - (level-1)*50;
    else base = 420 - (level-1)*30;
    return Math.max(220, base);
  }

  function startGame(){
    if(isRunning) return;
    // resume audio context on user gesture (mobile requirement)
    if(audioCtx.state === 'suspended') audioCtx.resume();

    score = 0; timeLeft = 30; hits = 0; misses = 0; level = 1;
    updateUI();
    isRunning = true;
    startBtn.textContent = 'Playing...';
    startBtn.disabled = true;

    timerInterval = setInterval(()=> {
      timeLeft--;
      timeEl.textContent = timeLeft + 's';
      // occasionally bump level as score increases
      level = Math.floor(score / 10) + 1;
      levelEl.textContent = level;
      if(timeLeft <= 0) endGame();
    }, 1000);

    // mole popper
    moleInterval = setInterval(()=> {
      popMole();
    }, 500);
  }

  function endGame(){
    clearInterval(timerInterval);
    clearInterval(moleInterval);
    isRunning = false;
    startBtn.textContent = 'Start';
    startBtn.disabled = false;
    // hide any up moles
    moles.forEach(m => m.classList.remove('up'));
    // update highscore
    const prevHigh = parseInt(localStorage.getItem(highScoreKey) || '0', 10);
    if(score > prevHigh) {
      localStorage.setItem(highScoreKey, score);
      highScoreEl.textContent = score;
      alert('🏆 New High Score: ' + score + '!');
    } else {
      alert('Game over! Score: ' + score);
    }
  }

  function resetGame(){
    clearInterval(timerInterval);
    clearInterval(moleInterval);
    isRunning = false;
    score = 0; timeLeft = 30; hits = 0; misses = 0; level = 1;
    updateUI();
    startBtn.textContent = 'Start';
    startBtn.disabled = false;
    moles.forEach(m => m.classList.remove('up'));
  }

  function updateUI(){
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft + 's';
    hitsEl.textContent = hits;
    missesEl.textContent = misses;
    levelEl.textContent = level;
  }

  // event: whack
  moles.forEach(mole => {
    mole.addEventListener('click', (e)=> {
      if(!isRunning) return;
      if(!mole.classList.contains('up')) {
        // clicking empty tile = miss penalty
        misses++; missesEl.textContent = misses; beep(200,0.03,0.03);
        return;
      }
      // successful hit
      mole.classList.remove('up');
      score += 1 + Math.floor(level/2);
      hits++; hitsEl.textContent = hits;
      // small time bonus for higher difficulty
      if(difficultyEl.value === 'hard') timeLeft += 1;
      updateUI();
      beep(880 - Math.random()*220, 0.06, 0.14);
    });

    // touch-friendly: tap also triggers click; ensure fast response for mobile
    mole.addEventListener('touchstart', (e)=> {
      e.preventDefault();
      mole.click();
    }, {passive:false});
  });

  startBtn.addEventListener('click', startGame);
  resetBtn.addEventListener('click', resetGame);

  // small accessibility: keyboard whack using number keys 1-9
  window.addEventListener('keydown', e => {
    const code = e.key;
    if(code >= '1' && code <= '9'){
      const idx = parseInt(code,10) - 1;
      moles[idx].click();
    } else if(code === ' '){ // space to start
      e.preventDefault();
      if(!isRunning) startGame();
    }
  });

  // initialize UI
  updateUI();
  // show saved highscore
  highScoreEl.textContent = localStorage.getItem(highScoreKey) || '0';
</script>
</body>
</html>
